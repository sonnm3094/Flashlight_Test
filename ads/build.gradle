import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

android {
    namespace "com.ads.admob"
    compileSdkVersion 37

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        //noinspection DataBindingWithoutKapt
        dataBinding true
    }
    lintOptions {
        abortOnError false
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'com.android.billingclient:billing-ktx:8.2.1'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"

    //noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.10.0"
    api "io.arrow-kt:arrow-core:2.2.0"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10"

    implementation(platform("com.google.firebase:firebase-bom:34.7.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")

    //admob
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'

    //mediation admob
    implementation 'com.google.ads.mediation:facebook:6.21.0.3'
    implementation 'com.google.ads.mediation:applovin:13.6.2.0'
    implementation ("com.google.ads.mediation:vungle:7.7.4.0")
    implementation ("com.google.ads.mediation:pangle:8.0.0.5.0")
    implementation("com.google.ads.mediation:mintegral:17.1.61.0")
    implementation("com.unity3d.ads:unity-ads:4.18.1")
    implementation("com.google.ads.mediation:unity:4.18.0.0")

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.9.0'

    //adjust
    implementation 'com.adjust.sdk:adjust-android:5.5.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    //fb sdk
    implementation 'com.facebook.android:facebook-android-sdk:18.1.3'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation "androidx.multidex:multidex:2.0.1"

//    implementation("com.google.firebase:firebase-messaging:25.0.1")
//    implementation("com.google.firebase:firebase-core:21.1.1")
}