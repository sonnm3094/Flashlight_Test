name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      keystorePath:
        description: 'Path to save the keystore (relative to repo root)'
        required: true
        default: 'app/key/af_projectbase.jks'
      alias:
        description: 'Key alias'
        required: true
        default: 'key'
      storePassword:
        description: 'Keystore password'
        required: true
        default: '123456'
      keyPassword:
        description: 'Key password'
        required: true
        default: '123456'
      validityDays:
        description: 'Validity in days'
        required: true
        default: '10000'
      commonName:
        description: 'Certificate CN (e.g. your name or company)'
        required: true
        default: 'Unknown'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ inputs.storePassword }}"
          echo "::add-mask::${{ inputs.keyPassword }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (provides keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          mkdir -p "$(dirname "${{ inputs.keystorePath }}")"
          keytool -genkeypair -v \
            -keystore "${{ inputs.keystorePath }}" \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 \
            -validity ${{ inputs.validityDays }} \
            -storepass "${{ inputs.storePassword }}" \
            -keypass "${{ inputs.keyPassword }}" \
            -dname "CN=${{ inputs.commonName }}, OU=Dev, O=Dev, L=HCM, S=HCM, C=VN"

      - name: Commit keystore to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.keystorePath }}"
          git commit -m "Add generated release keystore"
          git push

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ Keystore generated and pushed: \`${{ inputs.keystorePath }}\` (alias: \`${{ inputs.alias }}\`) on **${{ github.repository }}**"
          else
            MESSAGE="❌ Keystore generation failed on **${{ github.repository }}** — check run ${{ github.run_id }}"
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is empty — set it in repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL")
          echo "Discord response code: $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
